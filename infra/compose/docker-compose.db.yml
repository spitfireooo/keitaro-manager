name: keitaro-manager

services:
  database:
    container_name: keitaro-manager-database
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-keitaro_manager}
      POSTGRES_USER: ${DB_USERNAME:-keitaro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: