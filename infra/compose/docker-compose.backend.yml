name: keitaro-manager

services:
  migrations:
    container_name: keitaro-manager-migrations
    image: migrate/migrate:v4.18.3
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${DB_USERNAME:-keitaro}@database:5432/${DB_NAME:-keitaro_manager}?sslmode=disable"
      - "up"
    volumes:
      - ../../backend/internal/database/migrations:/migrations:ro
    depends_on:
      database:
        condition: service_healthy

  backend:
    container_name: keitaro-manager-backend
    build:
      context: ../../backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: "0.0.0.0:8080"
      DB_HOST: database
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-keitaro}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-keitaro_manager}
      DB_SSL_MODE: disable
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      KEITARO_BASE_URL: ${KEITARO_BASE_URL:-}
      KEITARO_DOMAIN_ID: ${KEITARO_DOMAIN_ID:-}
      KEITARO_GROUP_ID: ${KEITARO_GROUP_ID:-}
      KEITARO_TRAFFIC_SOURCE_ID: ${KEITARO_TRAFFIC_SOURCE_ID:-}
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
